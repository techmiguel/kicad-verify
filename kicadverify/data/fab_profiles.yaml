# Fab capability profiles (millimetres). Each profile is a requirement SOURCE: FAB-RULES-001 and
# FAB-DFM-001 cite it, and `confirmed: false` is reported as an unconfirmed source until a person
# checks the values against the fab's current capability page and sets `confirmed: true` (or
# defines the profile inline in requirements.yaml: params.fab.profile: {name, source, limits...}).
#
# Fab capabilities change. Treat these values as a starting point, never as the authority.
profiles:
  jlcpcb-1-2-layer-standard:
    title: JLCPCB rigid FR-4, 1-2 layers, standard process (no extra-cost options)
    source:
      kind: fab_capability
      ref: JLCPCB PCB manufacturing capabilities
      url: https://jlcpcb.com/capabilities/pcb-capabilities
      confirmed: false
      note: >-
        Values collected 2026-10-06 from secondary summaries of the capability page (the page itself
        could not be fetched); published figures differ between sources. Confirm before relying on it.
    layers_max: 2
    min_track_mm: 0.127
    min_spacing_mm: 0.127
    min_via_drill_mm: 0.3
    min_via_diameter_mm: 0.5
    min_via_annular_mm: 0.1
    min_pth_drill_mm: 0.3
    min_pth_annular_mm: 0.18
    max_drill_mm: 6.3
    min_hole_to_hole_mm: 0.5
    min_copper_to_edge_mm: 0.3
    board_max_mm: [400, 500]
    board_min_mm: [6, 6]
    thickness_mm: [0.4, 2.0]
  oshpark-4-layer:
    title: OSH Park 4-layer prototype service
    source:
      kind: fab_capability
      ref: OSH Park 4 Layer Prototype Service
      url: https://docs.oshpark.com/services/four-layer/
      confirmed: false
      note: >-
        Values from the OSH Park 4-layer KiCad template maintained by a KiCad lead developer
        (github.com/sethhillbrand/kicad_templates, OshPark-4Layer, last changed 2019-10-24), read with
        `kicadverify profiles --from`; the fab's page could not be fetched to confirm them. Limits the
        template does not state (plated-hole annular ring, hole to hole, copper to edge, board size,
        thickness) are reported as unchecked, not assumed.
    layers_max: 4
    min_track_mm: 0.127
    min_spacing_mm: 0.127
    min_via_drill_mm: 0.254
    min_via_diameter_mm: 0.4572
    min_via_annular_mm: 0.1016
