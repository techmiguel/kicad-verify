[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-verify"
version = "0.3.0"
description = "Requirements-based verification for KiCad projects: every requirement has a source, a verification method, evidence, explicit coverage and a VERIFIED / FAILED / NOT_VERIFIABLE / NOT_RUN status; CI gates and release manifests"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pypdf[crypto]>=4", "fonttools>=4"]
keywords = ["kicad", "pcb", "verification", "requirements", "traceability", "dfm", "ci", "erc", "drc", "design-review", "claude-code"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
kicadverify = "kicadverify.cli:main"

[project.urls]
Homepage = "https://github.com/techmiguel/kicad-verify"

[tool.setuptools.packages.find]
include = ["kicadverify*"]

[tool.setuptools.package-data]
kicadverify = ["data/*", "data/templates/*", "data/ci/*", "data/claude/skills/*/*"]
