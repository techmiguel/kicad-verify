name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_unit.py tests/test_framework.py tests/test_release_flow.py
  integration:
    # Real KiCad 10 on a fabricated board, with kicad-cli from the official image through the same
    # wrapper the `kicadverify init --ci github` template uses.
    runs-on: ubuntu-latest
    env:
      KICAD_IMAGE: kicad/kicad:10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kicad-cli wrapper
        run: |
          docker pull --quiet "$KICAD_IMAGE"
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/kicad-cli" <<'SH'
          #!/bin/sh
          exec docker run --rm -i -u 0:0 -e HOME=/home/kicad -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v /tmp:/tmp -w "$PWD" "$KICAD_IMAGE" kicad-cli "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/kicad-cli"
          echo "KICAD_CLI=$RUNNER_TEMP/bin/kicad-cli" >> "$GITHUB_ENV"
      - run: pip install -e ".[test]" && kicadverify setup
      - run: pytest -q tests/test_integration.py
